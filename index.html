<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12263A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Agenda di Lavoro</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<!-- Supabase Client per la gestione cloud (facoltativo/opzionale) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#EDF1F4;--sf:#fff;--ink:#12263A;--mut:#5E6E7E;--ln:#D6DEE5;--navy:#12263A;--amb:#F2A900;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1620;--sf:#132433;--ink:#E7EEF4;--mut:#8FA2B3;--ln:#243749}}
:root[data-theme="dark"]{--bg:#0B1620;--sf:#132433;--ink:#E7EEF4;--mut:#8FA2B3;--ln:#243749}
html{background:var(--navy);scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding-bottom:84px}
button{font:inherit;color:inherit;cursor:pointer}
.cn{font-family:"Barlow Semi Condensed",Barlow,system-ui,sans-serif}
header{background:var(--navy);color:#fff;padding:14px 16px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
h1{margin:0;font:700 40px/1 "Barlow Semi Condensed",Barlow,system-ui,sans-serif;letter-spacing:.2px}
.yr{color:var(--amb);font:600 19px/1.2 "Barlow Semi Condensed",Barlow,system-ui,sans-serif}
.nv{display:flex;gap:8px;align-items:center}
.nv button{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center}
main{padding:14px 12px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;text-align:center;font:600 13px "Barlow Semi Condensed",Barlow,system-ui,sans-serif;color:var(--mut)}
.wk .we{opacity:.65}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.g i{display:block}
.c{position:relative;aspect-ratio:1/1.5;background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:4px 3px 3px;display:flex;flex-direction:column;align-items:stretch;text-align:left;min-width:0}
.c b{font:700 16px/1 "Barlow Semi Condensed",Barlow,system-ui,sans-serif;padding-left:2px}
.c em{display:block;margin-top:4px;font:600 10px/1 Barlow,sans-serif;font-style:normal;color:#fff;border-radius:4px;padding:3px 0;text-align:center;overflow:hidden;white-space:nowrap}
.c small{display:block;margin-top:3px;font-size:9px;line-height:1;color:var(--ink);font-weight:600;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c .dots{position:absolute;right:4px;top:5px;display:flex;gap:3px}
.dots span{width:7px;height:7px;border-radius:50%}
.dots .o{background:var(--amb)}
.dots .r{background:var(--ink)}
.c small.b{text-transform:uppercase}
.c.td{outline:2px solid var(--amb);outline-offset:1px}
.lg{display:flex;flex-wrap:wrap;gap:6px 12px;margin:14px 2px 0;font-size:13px;color:var(--mut)}
.lg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:5px}
.lg .d::before{border-radius:50%}
.cd{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.cd h3{margin:0 0 10px;font:600 17px/1.2 "Barlow Semi Condensed",Barlow,system-ui,sans-serif}
.tls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tl{background:var(--sf);border:1px solid var(--ln);border-left:5px solid var(--c);border-radius:10px;padding:10px 12px}
.tl b{display:block;font:700 34px/1 "Barlow Semi Condensed",Barlow,system-ui,sans-serif}
.tl span{color:var(--mut);font-size:14px}
.rw{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-top:1px solid var(--ln)}
.rw:first-of-type{border-top:0}
.rw b{font:700 20px "Barlow Semi Condensed",Barlow,system-ui,sans-serif}
.bar{height:8px;border-radius:4px;background:var(--ln);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--c,var(--amb));border-radius:4px}
.big{font:700 44px/1 "Barlow Semi Condensed",Barlow,system-ui,sans-serif}
.mu{color:var(--mut);font-size:14px;margin:4px 0 0}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:14px;color:var(--mut)}
input,select{display:block;width:100%;margin-top:4px;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink)}
input[type=file]{padding:8px;font-size:14px}
input[type=checkbox]{display:inline-block;width:20px;height:20px;margin:0 8px 0 0;vertical-align:middle}
.tb{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tb button{flex:1;border:0;background:none;padding:10px 0 9px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;border-top:3px solid transparent}
.tb button.on{color:var(--ink);border-top-color:var(--amb);font-weight:600}
.tb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bd{position:fixed;inset:0;background:rgba(8,16,24,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.sh{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;transform:translateY(100%);transition:transform .22s ease;z-index:21}
.open .bd{opacity:1;pointer-events:auto}
.open .sh{transform:none}
#cf .bd{z-index:30}
.dl{position:fixed;left:16px;right:16px;top:50%;transform:translateY(-50%) scale(.96);opacity:0;pointer-events:none;background:var(--sf);border-radius:16px;padding:20px 18px;transition:opacity .15s,transform .15s;z-index:31;box-shadow:0 12px 32px rgba(0,0,0,.35)}
.open .dl{opacity:1;pointer-events:auto;transform:translateY(-50%)}
.dl h2{margin:0;font:700 24px/1.2 "Barlow Semi Condensed",Barlow,system-ui,sans-serif}
.sh h2{margin:0;font:700 26px/1.1 "Barlow Semi Condensed",Barlow,system-ui,sans-serif}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0}
.tp{background:var(--bg);border:1px solid var(--ln);border-left:5px solid var(--c);border-radius:8px;padding:9px 10px;text-align:left;font-size:14px}
.tp.on{background:var(--c);border-color:var(--c);color:#fff;font-weight:600}
.sh label{margin-top:10px}
.ac{display:flex;gap:10px;margin-top:16px}
.ac button{flex:1;padding:13px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);font-weight:600}
.ac .pr{background:var(--navy);border-color:var(--navy);color:#fff;flex:2}
.ad{display:flex;gap:8px;margin-bottom:10px}.ad input{margin:0}.ad button{padding:0 16px;border-radius:8px;border:0;background:var(--navy);color:#fff;font-weight:600}
.chs{display:flex;flex-wrap:wrap;gap:6px;max-height:260px;overflow:auto}.cp{display:inline-flex;align-items:center;background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:3px 4px 3px 9px;font-size:14px}.cp button{border:0;background:none;color:var(--mut);font-size:18px;line-height:1;padding:0 6px}
.sg{display:flex;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:3px;margin-bottom:12px}.sg button{flex:1;border:0;background:none;padding:9px;border-radius:8px;font-weight:600;color:var(--mut)}.sg button.on{background:var(--navy);color:#fff}
.tw{overflow-x:auto;background:var(--sf);border:1px solid var(--ln);border-radius:14px}
table{border-collapse:collapse;font-size:14px;white-space:nowrap}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--ln)}
th{font:600 13px "Barlow Semi Condensed",Barlow,system-ui,sans-serif;color:var(--mut);vertical-align:bottom;white-space:normal;min-width:62px}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--sf);font-weight:600}
tr.tt td{font-weight:700;border-bottom:0}
.tw tr>:nth-child(2){--k:#1F9D55}
.tw tr>:nth-child(n+3):nth-child(-n+9){--k:#D13438}
.tw tr>:nth-child(n+10):nth-child(-n+12){--k:#C27C00}
.tw tr>:nth-child(n+13):nth-child(-n+14){--k:#3B6FE0}
.tw tr>:nth-child(n+15){--k:#0E9AA7}
.tw td:not(:first-child){background:color-mix(in srgb,var(--k) 9%,var(--sf));color:var(--k);font-weight:600}
.tw thead tr:not(.gp) th:not(:first-child){color:var(--k);border-bottom:3px solid var(--k)}
.tw .gp th{background:var(--k);color:#fff;text-align:center;border-bottom:0;font-size:14px}
.tw tr.cm td:first-child{box-shadow:inset 4px 0 0 var(--amb)}
.tw tr.tt td{font-weight:800;border-top:2px solid var(--ink)}
.tw tr.tt td:not(:first-child){background:color-mix(in srgb,var(--k) 22%,var(--sf))}
.tw td[data-rt]{cursor:pointer;text-decoration:underline dotted}
.bt{display:block;width:100%;margin-top:12px;padding:13px;border-radius:10px;border:0;background:var(--navy);color:#fff;font-weight:600}
.ss{margin-top:6px;font-size:12px;color:#9FB3C6;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);padding:4px 10px;border-radius:20px;border:0}
.auth-scr{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;justify-content:center;padding:24px 16px;overflow:auto}
.auth-scr.open{display:flex}
.auth-box{max-width:420px;width:100%;margin:0 auto;background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:24px 20px;box-shadow:0 10px 30px rgba(0,0,0,.08);text-align:center}
@media(prefers-reduced-motion:reduce){.sh,.bd,.dl{transition:none}}
</style>
</head>
<body>
<header>
  <div>
    <div class="yr" id="yr"></div>
    <h1 id="mt"></h1>
    <button class="ss" id="ss" data-a="auth-open">Accedi / Registrati</button>
  </div>
  <div class="nv">
    <button id="thm-btn" data-a="thm" aria-label="Cambia tema chiaro/scuro" title="Cambia tema">☾</button>
    <button data-n="-1" aria-label="Mese precedente">‹</button>
    <button data-n="1" aria-label="Mese successivo">›</button>
  </div>
</header>
<main id="mn"></main>
<nav class="tb">
<button data-v="cal"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendario</button>
<button data-v="riep"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Riepilogo</button>
<button data-v="res"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Residui</button>
<button data-v="bd"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3v-6"/></svg>Banca dati</button>
</nav>
<div id="ov"><div class="bd" data-x="1"></div><div class="sh" id="sh"></div></div>
<div id="cf"><div class="bd" data-cf="0"></div><div class="dl" id="cfm"></div></div>

<!-- SCHERMATA AUTENTICAZIONE / REGISTRAZIONE -->
<div id="auth-scr" class="auth-scr">
  <div class="auth-box">
    <div style="color:var(--amb);font:700 14px 'Barlow Semi Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase">Agenda di Lavoro</div>
    <h2 id="auth-title" style="margin:4px 0 8px;font:700 28px/1.1 'Barlow Semi Condensed',sans-serif">Accedi o Registrati</h2>
    <p class="mu" id="auth-sub" style="margin-bottom:16px">Inserisci la tua email e password per sincronizzare i turni in sicurezza.</p>
    
    <div class="sg" id="auth-tabs" style="margin-bottom:16px">
      <button type="button" id="tab-login" onclick="switchAuthTab('login')" class="on">Accedi</button>
      <button type="button" id="tab-register" onclick="switchAuthTab('register')">Registrati</button>
    </div>

    <form id="auth-form" onsubmit="handleAuthSubmit(event)" style="text-align:left">
      <label style="margin-bottom:8px">Email<input type="email" id="auth-email" required placeholder="tua.email@dominio.it" autocomplete="email"></label>
      <label style="margin-bottom:12px">Password<input type="password" id="auth-password" required placeholder="••••••••" autocomplete="current-password"></label>
      
      <!-- Pulsante Recupero Password -->
      <div id="forgot-password-box" style="margin-bottom:12px; text-align:right;">
        <a href="#" onclick="handleForgotPassword(event)" style="font-size:12px; color:var(--mut); text-decoration:underline;">Password dimenticata?</a>
      </div>

      <div id="auth-err" style="color:#D13438;font-weight:600;font-size:13px;margin-bottom:10px;display:none"></div>
      <button type="submit" class="bt" id="auth-submit-btn" style="margin-top:0">Accedi</button>
    </form>

    <div id="auth-logged-area" style="display:none;margin-top:10px">
      <p class="mu" style="font-weight:600;color:#1F9D55">Connesso come: <span id="auth-user-email"></span></p>
      <p id="sync-label" class="mu" style="font-size:11px;margin:-4px 0 10px;opacity:.8"></p>
      <div id="pw-change-box" style="display:none;margin:14px 0 6px;padding-top:12px;border-top:1px solid var(--ln);text-align:left">
        <p class="mu" id="pw-title" style="font-weight:600;margin-bottom:8px">Scegli la nuova password</p>
        <label style="margin-bottom:8px">Nuova password<input type="password" id="new-password" autocomplete="new-password" placeholder="almeno 8 caratteri"></label>
        <label style="margin-bottom:8px">Ripeti la nuova password<input type="password" id="new-password2" autocomplete="new-password" placeholder="ripeti la password"></label>
        <div id="pw-msg" style="font-weight:600;font-size:13px;margin-bottom:8px;display:none"></div>
        <button class="bt" onclick="changePassword()" style="margin-top:0">Salva nuova password</button>
      </div>
      <button class="bt" onclick="authLogout()" style="background:#D13438;margin-top:8px">Disconnetti</button>
      <button class="bt" onclick="closeAuth()" style="background:var(--bg);color:var(--ink);border:1px solid var(--ln);margin-top:8px">Chiudi</button>
      <div style="margin-top:14px;text-align:center">
        <a href="#" onclick="togglePwBox(event)" style="font-size:12px;color:var(--mut);text-decoration:underline">Cambia password</a>
      </div>
    </div>

    <div id="auth-bypass-box" style="margin-top:16px;border-top:1px solid var(--ln);padding-top:14px">
      <button onclick="bypassAuth()" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);font-weight:600;font-size:14px">Accedi senza registrazione</button>
    </div>
    <div id="auth-close-box" style="display:none;margin-top:8px">
      <button onclick="closeAuth()" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--ln);background:transparent;font-weight:600;font-size:14px">Chiudi</button>
    </div>
  </div>
</div>
<datalist id="tl"></datalist>

<script>
const SUPABASE_URL = "https://qticbwkdeugyxjaodnxu.supabase.co"; 
const SUPABASE_ANON_KEY = "sb_publishable_YXccw8IfeZB3i5BRiL-KUg_Yt3f4_FL"; 

let RECOVERY_LINK = /type=recovery/.test(location.hash);
let supabaseClient = null;
if(SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase){
  try{ supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, storage: window.localStorage } }); }catch(e){}
}

let isRegMode = false;
function switchAuthTab(m){
  isRegMode = (m === 'register');
  document.getElementById('tab-login').className = isRegMode ? "" : "on";
  document.getElementById('tab-register').className = isRegMode ? "on" : "";
  document.getElementById('auth-title').textContent = isRegMode ? "Crea un Account" : "Accedi";
  document.getElementById('auth-submit-btn').textContent = isRegMode ? "Registrati" : "Accedi";
  // Nascondi il link password dimenticata se è in modalità registrazione
  document.getElementById('forgot-password-box').style.display = isRegMode ? 'none' : 'block';
  document.getElementById('auth-err').style.display = 'none';
}

function showAuthState(email){
  const logged = !!email;
  const d = (id,v)=>{ const el=document.getElementById(id); if(el) el.style.display=v; };
  d('auth-tabs', logged?'none':'');
  d('auth-form', logged?'none':'');
  d('auth-sub', logged?'none':'');
  d('auth-bypass-box', logged?'none':'');
  d('auth-close-box', logged?'none':'block');
  d('auth-logged-area', logged?'block':'none');
  d('pw-change-box', (logged && RECOVERY_LINK) ? 'block' : 'none');
  document.getElementById('auth-title').textContent = logged ? "Account" : (isRegMode ? "Crea un Account" : "Accedi");
  if(logged) document.getElementById('auth-user-email').textContent = email;
  if(logged) updateSyncLabel();
}

async function openAuth(){
  let email = null;
  if(supabaseClient){
    try{
      const { data: { session } } = await supabaseClient.auth.getSession();
      if(session) email = session.user.email;
    }catch(e){}
  }
  showAuthState(email);
  document.getElementById('auth-scr').classList.add('open');
}

function togglePwBox(e){
  if(e) e.preventDefault();
  const box = document.getElementById('pw-change-box');
  const open = box.style.display !== 'block';
  box.style.display = open ? 'block' : 'none';
  document.getElementById('pw-msg').style.display = 'none';
  document.getElementById('new-password').value = '';
  document.getElementById('new-password2').value = '';
  if(open) document.getElementById('new-password').focus();
}

async function changePassword(){
  const p1 = document.getElementById('new-password');
  const p2 = document.getElementById('new-password2');
  const msg = document.getElementById('pw-msg');
  const pw = p1.value.trim();
  msg.style.display = 'block';
  msg.style.color = '#D13438';
  if(pw.length < 8){ msg.textContent = "La password deve avere almeno 8 caratteri."; return; }
  if(pw !== p2.value.trim()){ msg.textContent = "Le due password non coincidono."; return; }
  if(!supabaseClient){ msg.textContent = "Funzione cloud non attiva."; return; }
  try{
    const { data: { session } } = await supabaseClient.auth.getSession();
    if(!session) throw new Error("Devi essere collegato per cambiare la password.");
    const { error } = await supabaseClient.auth.updateUser({ password: pw });
    if(error) throw error;
    p1.value = ''; p2.value = '';
    RECOVERY_LINK = false;
    msg.style.color = '#1F9D55';
    msg.textContent = "Password cambiata.";
    setTimeout(()=>{ const b=document.getElementById('pw-change-box'); if(b) b.style.display='none'; }, 2500);
  }catch(e){
    const t = (e && e.message) || "";
    if(/reauthenticat/i.test(t)) msg.textContent = "Per sicurezza scollegati e rientra con la password attuale, poi riprova.";
    else if(/different from the old|same password/i.test(t)) msg.textContent = "La nuova password deve essere diversa da quella attuale.";
    else msg.textContent = t || "Errore nel cambio password.";
  }
}

function closeAuth(){
  document.getElementById('auth-scr').classList.remove('open');
}

function bypassAuth(){
  document.getElementById('auth-scr').classList.remove('open');
  localStorage.setItem("agenda_local_user", "Locale");
  updateAuthBtnLabel("Modalità Locale");
}

function updateAuthBtnLabel(txt){
  const s = document.getElementById('ss');
  if(s) s.textContent = txt;
}

async function handleForgotPassword(e){
  e.preventDefault();
  const email = document.getElementById('auth-email').value.trim();
  const errDiv = document.getElementById('auth-err');
  
  if(!email){
    errDiv.textContent = "Inserisci prima la tua email nel campo sopra per recuperare la password.";
    errDiv.style.display = 'block';
    return;
  }
  
  if(!supabaseClient){
    alert("Funzione cloud non attiva (chiavi Supabase non inserite).");
    return;
  }

  try {
    const { data, error } = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: location.origin + location.pathname,
    });
    if(error) throw error;
    alert("Email di recupero inviata! Controlla la tua casella di posta.");
  } catch(err){
    errDiv.textContent = err.message || "Errore durante l'invio dell'email di recupero.";
    errDiv.style.display = 'block';
  }
}

async function handleAuthSubmit(e){
  e.preventDefault();
  const email = document.getElementById('auth-email').value.trim();
  const pass = document.getElementById('auth-password').value.trim();
  const errDiv = document.getElementById('auth-err');
  errDiv.style.display = 'none';

  if(!supabaseClient){
    localStorage.setItem("agenda_local_user", email);
    document.getElementById('auth-scr').classList.remove('open');
    updateAuthBtnLabel(email);
    return;
  }

  try {
    if(isRegMode){
      const { data, error } = await supabaseClient.auth.signUp({ email, password: pass });
      if(error) throw error;
      alert("Registrazione completata con successo! Effettua ora l'accesso.");
      switchAuthTab('login');
    } else {
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: pass });

function storedAuthEmail(){

/* Carica la libreria Supabase se all'avvio non era disponibile (es. rete non ancora pronta) */
async function ensureSupabase(){
  if(supabaseClient) return true;
  if(!window.supabase){
    await new Promise(res=>{
      const sc=document.createElement('script');
      sc.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
      sc.onload=res; sc.onerror=res;
      document.head.appendChild(sc);
    });
  }
  if(window.supabase){
    try{ supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, storage: window.localStorage } }); }catch(e){}
  }
  return !!supabaseClient;
}

function checkInitialAuth(tries){
  tries = tries || 0;
  const localUser = localStorage.getItem("agenda_local_user");
  const kept = storedAuthEmail();
  const openLogin = ()=>{ showAuthState(null); document.getElementById('auth-close-box').style.display='none'; document.getElementById('auth-scr').classList.add('open'); };
  const goLocal = ()=>{ updateAuthBtnLabel(localUser === "Locale" ? "Modalità Locale" : localUser); };
  const retry = ()=>{ if(tries < 4) setTimeout(()=>checkInitialAuth(tries+1), 2500*(tries+1)); };

  /* nessuna sessione valida adesso: se nel telefono ce n'e' una salvata NON si mostra il login, si riprova */
  const noSession = ()=>{
    if(kept){ updateAuthBtnLabel(kept); retry(); }
    else if(localUser){ goLocal(); }
    else { openLogin(); }
  };

  if(!supabaseClient){
    if(kept || localUser){
      if(kept) updateAuthBtnLabel(kept); else goLocal();
      if(kept && tries < 4) setTimeout(()=>{ ensureSupabase().then(()=>checkInitialAuth(tries+1)); }, 2500*(tries+1));
    } else {
      openLogin();
    }
    return;
  }
  supabaseClient.auth.getSession().then(({data: {session}})=>{
    if(session){
      authReady = true;
      updateAuthBtnLabel(session.user.email);
      loadUserDataCloud(session.user.id);
      if(RECOVERY_LINK) openAuth();
    } else {
      noSession();
    }
  }).catch(noSession);
}

function recheckAuth(){
  if(authReady || !storedAuthEmail()) return;
  ensureSupabase().then(()=>checkInitialAuth(0));
}

function wk(x){const w=[];for(let i=a;i+5<r.nd;i+=7){const s=x.c.slice(i,i+6).map(nc);w.push(s.join(" "))}return w}

const SYNC_KEY="agenda_ultima_sync";
function updateSyncLabel(){
  const el=document.getElementById('sync-label'); if(!el) return;
  let t="Non ancora sincronizzato";
  try{
    const v=+localStorage.getItem(SYNC_KEY);
    if(v){
      const dt=new Date(v), now=new Date();
      const hm=pad(dt.getHours())+":"+pad(dt.getMinutes());
      const same=dt.toDateString()===now.toDateString();
      t="Ultima sincronizzazione "+(same?"":"il "+pad(dt.getDate())+"/"+pad(dt.getMonth()+1)+" ")+"alle ore "+hm;
    }
  }catch(e){}
  if(isMerge()) t+=" · modifiche in attesa";
  el.textContent=t;
}
function markSynced(){
  try{localStorage.setItem(SYNC_KEY,String(Date.now()))}catch(e){}
  updateSyncLabel();
}
async function loadUserDataCloud(userId){
  if(!supabaseClient||syncing) return;
  syncing=true;
  try {
    const { data, error } = await supabaseClient.from('user_agendas').select('content').eq('user_id', userId).maybeSingle();
    if(error) throw error;
    const cloud = data && data.content;
    const cloudHas = hasData(cloud);
    const merged = isMerge();
    if(cloudHas){ DB = merged ? mergeDB(cloud, DB) : cloud; }
    if(Array.isArray(DB.s)) SEDI = DB.s;
    if(Array.isArray(DB.t)) TURNI = DB.t;
    store();
    fillTl();
    render();
    if(merged || (!cloudHas && hasData(DB))){
      const r = await supabaseClient.from('user_agendas').upsert({ user_id: userId, content: DB }, { onConflict: 'user_id' });
      if(r.error) throw r.error;
      setMerge(false);
    }
    markSynced();
  } catch(e){
    /* offline o errore: i dati restano sul telefono e si riprova appena possibile */
  } finally { syncing = false; }
}
async function saveUserDataCloud(force){
  if(!supabaseClient) return;
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if(!session){ setMerge(true); updateSyncLabel(); return; }
    if(isMerge() && !force){ await loadUserDataCloud(session.user.id); return; }
    const { error } = await supabaseClient.from('user_agendas').upsert({ user_id: session.user.id, content: DB }, { onConflict: 'user_id' });
    if(error) throw error;
    if(force) setMerge(false);
    markSynced();
  } catch(e){ setMerge(true); updateSyncLabel(); }
}
async function trySync(){
  if(!supabaseClient||!isMerge()) return;
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if(session) await loadUserDataCloud(session.user.id);
  } catch(e){}
}
